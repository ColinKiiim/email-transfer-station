name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate Agent credential contract
        run: |
          node --test scripts/validate-agent-mail-skill.test.mjs
          node scripts/validate-agent-mail-skill.mjs
      - name: Validate Worker
        working-directory: worker
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run test
          pnpm run build
      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run test
          pnpm run build
          pnpm run build:pages
      - name: Validate Pages
        working-directory: pages
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
      - name: Check repository whitespace
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "origin/$BASE_REF...HEAD"
          elif printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            git diff --check "$(git hash-object -t tree /dev/null)..HEAD"
          else
            git diff --check "$BEFORE_SHA..HEAD"
          fi

  e2e:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Docker E2E
        working-directory: e2e
        run: npm test
      - name: Clean Docker E2E
        if: always()
        working-directory: e2e
        run: npm run test:down

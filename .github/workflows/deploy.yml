name: Deploy

# Production release: runs after CI passes on a push to main (or by hand).
# Deploys the Worker first, then Pages, the same order as a local release.
# D1 migrations are never run here; they stay a separately authorized action.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ets-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'ColinKiiim/email-transfer-station' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      PAGES_PROJECT: email-transfer-station
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HAS_WORKER_CONFIG: ${{ secrets.WORKER_WRANGLER_TOML != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: corepack enable

      - name: Verify release secrets
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; missing=1; fi
          done
          exit "$missing"

      - name: Skip Worker (no WORKER_WRANGLER_TOML secret)
        if: env.HAS_WORKER_CONFIG != 'true'
        run: echo "::warning::WORKER_WRANGLER_TOML is not set; Worker was NOT deployed, only Pages."

      - name: Deploy Worker
        if: env.HAS_WORKER_CONFIG == 'true'
        working-directory: worker
        env:
          WORKER_WRANGLER_TOML: ${{ secrets.WORKER_WRANGLER_TOML }}
        run: |
          printf '%s\n' "$WORKER_WRANGLER_TOML" > wrangler.toml
          pnpm install --frozen-lockfile
          # Wrangler prints binding values; keep runtime configuration out of the log.
          if pnpm exec wrangler deploy --minify > "$RUNNER_TEMP/worker-deploy.log" 2>&1; then
            grep -E 'Uploaded|Deployed|Current Version ID' "$RUNNER_TEMP/worker-deploy.log" || true
          else
            grep -E 'ERROR|✘' "$RUNNER_TEMP/worker-deploy.log" | grep -v '=' | head -20 || true
            echo "::error::Worker deploy failed (full log withheld)"
            exit 1
          fi
          rm -f wrangler.toml

      - name: Build Pages
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:pages

      - name: Deploy Pages
        working-directory: pages
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          branch=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
            | jq -r '.result.production_branch // empty')
          if [ -z "$branch" ]; then echo "::error::Pages project production branch not found"; exit 1; fi
          pnpm exec wrangler pages deploy ../frontend/dist \
            --project-name "$PAGES_PROJECT" \
            --branch "$branch" \
            --commit-hash "$RELEASE_SHA"
